name: Construire et publier l’image

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Déployer cette version après construction
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l’image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_PATH=${{ vars.IHME_BASE_PATH || '/presences-aux-seances-de-triathlon/' }}
            VITE_COURSE_DEMO_MODE=true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Résumé de la version
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Image prête\n\nCommit : `%s`\n\nImage : `%s@%s`\n\nLe déploiement reste une action manuelle.\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Déployer sur le serveur du cours
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          DEPLOY_URL: ${{ vars.IHME_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.IHME_DEPLOY_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 deploy/request.py